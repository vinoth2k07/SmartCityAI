version: '3.8'

services:
  smartcity-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://smartcity:smartcity_secret@postgres:5432/smartcity360
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=smartcity360_production_jwt_secret_key_2026
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: smartcity_postgis
    environment:
      POSTGRES_USER: smartcity
      POSTGRES_PASSWORD: smartcity_secret
      POSTGRES_DB: smartcity360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: smartcity_redis
    ports:
      - "6379:6379"
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: smartcity_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: smartcity_grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: always

volumes:
  pgdata:
